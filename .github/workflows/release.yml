name: Release

# Triggered by the git tag, not by GitHub's release table. That way the tag
# always exists first and the build runs before anything becomes visible.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Needed so the annotated tag object (and its message) is available
          # to the release notes step below.
          fetch-depth: 0

      - name: Build the bundle
        run: |
          npm install
          npm run build

      # `npm run build` already runs the sanity checks; this adds the one that
      # only makes sense at release time -- that the tag, package.json and
      # CARD_VERSION all say the same thing. Failing here means no release is
      # created, which is the point.
      - name: Check the tag against the version
        env:
          TAG: ${{ github.ref_name }}
        run: npm run check -- "$TAG"

      # Draft first: a draft release is invisible over the API, so HACS can
      # never see a release whose asset has not been uploaded yet. If the build
      # above failed we never get here and no release is created at all.
      #
      # --verify-tag keeps the direction right: without it gh would create a
      # missing tag from --target, letting GitHub write into the ref database.
      - name: Create draft release with the bundle
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # 0.x is not a release by convention -- mark it as a pre-release so
          # HACS only offers it to users who enabled the beta switch.
          FLAGS=""
          case "$TAG" in
            v0.*) FLAGS="--prerelease" ;;
          esac

          # Derived rather than hard-coded, so the asset name cannot drift away
          # from what hacs.json declares and the build produces.
          FILE=$(node -p "require('./hacs.json').filename")

          # Hand-written notes live in the annotated tag, i.e. in the object
          # database; --generate-notes appends the commit listing below them.
          gh release create "$TAG" \
            --draft \
            --verify-tag \
            $FLAGS \
            --title "$TAG" \
            --notes "$(git tag -l --format='%(contents)' "$TAG")" \
            --generate-notes \
            "dist/$FILE#Lovelace card bundle"

      # Only now does the release become visible, asset included.
      - name: Promote the draft to published
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false
