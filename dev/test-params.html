<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>liquid-level-gauge-card parameter matrix</title>
    <style>
      body { font: 13px -apple-system, sans-serif; background: #f4f4f4; margin: 0; padding: 16px; }
      .grid { display: grid; grid-template-columns: repeat(4, 300px); gap: 12px; }
      .case { background: #fff; border: 1px solid #ccc; border-radius: 6px; overflow: hidden; }
      .case > h3 { margin: 0; padding: 6px 8px; background: #222; color: #fff; font-size: 12px; font-weight: 600; }
      .case > .expect { padding: 4px 8px; font-size: 11px; color: #555; border-bottom: 1px solid #eee; }
      /* Stub of HA's ha-card so the card has something to live in. */
      ha-card { display: block; padding: 8px; }
      ha-card .hdr { font-weight: 700; font-size: 15px; padding: 4px 0 8px; }
    </style>
  </head>
  <body>
    <div class="grid" id="grid"></div>

    <script type="module" src="/liquid-level-gauge-card.js"></script>
    <script type="module">
      // --- Minimal stubs for the Home Assistant elements the card renders into ---
      // Must use shadow DOM + <slot>: the card renders its content as ha-card's
      // LIGHT DOM children, so a stub that touches innerHTML would delete them.
      class HaCard extends HTMLElement {
        constructor() {
          super();
          this.attachShadow({ mode: 'open' }).innerHTML =
            '<style>.hdr{font-weight:700;font-size:15px;padding:4px 0 8px}</style>' +
            '<div class="hdr"></div><slot></slot>';
        }
        set header(v) { this._h = v; this._paint(); }
        connectedCallback() { this._paint(); }
        _paint() { this.shadowRoot.querySelector('.hdr').textContent = this._h ?? ''; }
      }
      customElements.define('ha-card', HaCard);

      class HuiWarning extends HTMLElement {
        connectedCallback() { this.style.cssText = 'display:block;padding:8px;background:#fff3cd;color:#856404'; }
      }
      customElements.define('hui-warning', HuiWarning);

      class HuiErrorCard extends HTMLElement {
        setConfig(c) { this._c = c; }
        connectedCallback() {
          this.style.cssText = 'display:block;padding:8px;background:#f8d7da;color:#721c24';
          this.textContent = 'ERROR CARD: ' + (this._c ? this._c.error : '');
        }
      }
      customElements.define('hui-error-card', HuiErrorCard);

      // --- Fake hass ---
      const hass = {
        states: {
          'sensor.tank':        { entity_id: 'sensor.tank',        state: '20',          attributes: { friendly_name: 'Cistern Level' } },
          'sensor.flow':        { entity_id: 'sensor.flow',        state: '3.5',         attributes: { friendly_name: 'Cistern Level' } },
          'sensor.unavailable': { entity_id: 'sensor.unavailable', state: 'unavailable', attributes: { friendly_name: 'Cistern Level' } },
          'sensor.percent':     { entity_id: 'sensor.percent',     state: '75',          attributes: { unit_of_measurement: '%', friendly_name: 'Cistern Level' } },
          'sensor.pump':        { entity_id: 'sensor.pump',        state: '450',         attributes: { unit_of_measurement: 'W', friendly_name: 'Pump Power' } },
          'sensor.nounit':      { entity_id: 'sensor.nounit',      state: '7',           attributes: { friendly_name: 'Bare Number' } },
          'sensor.unknown':     { entity_id: 'sensor.unknown',     state: 'unknown',     attributes: { friendly_name: 'Cistern Level' } },
          'sensor.flowlh':      { entity_id: 'sensor.flowlh',      state: '12',          attributes: { unit_of_measurement: 'L/h' } },
          'sensor.raw':         { entity_id: 'sensor.raw',         state: '2399.673828125', attributes: { unit_of_measurement: 'L', friendly_name: 'Roh' } },
          'sensor.suggested':   { entity_id: 'sensor.suggested',   state: '2399.673828125', attributes: { unit_of_measurement: 'L', friendly_name: 'Vorschlag', suggested_display_precision: 2 } },
          'sensor.registry2':   { entity_id: 'sensor.registry2',   state: '2399.673828125', attributes: { unit_of_measurement: 'L', friendly_name: 'Registry2' } },
          'sensor.registry0':   { entity_id: 'sensor.registry0',   state: '2399.673828125', attributes: { unit_of_measurement: 'L', friendly_name: 'Registry0', suggested_display_precision: 2 } },
          'sensor.negative':    { entity_id: 'sensor.negative',    state: '-5',          attributes: { friendly_name: 'Cistern Level' } },
        },
        localize: (k) => k,
        language: 'en',
        locale: { language: 'en', number_format: 'language' },
        // Entity-Registry: hier liegt display_precision, NICHT im State
        entities: {
          'sensor.registry2': { display_precision: 2 },
          'sensor.registry0': { display_precision: 0 },
        },
        callService: () => {},
      };

      const cases = [
        ['minimal (entity, default max_level 40)', 'Wert 20 von 40 -> halb voll', { entity: 'sensor.tank' }],
        ['name', 'Kopfzeile "Zisterne"', { entity: 'sensor.tank', name: 'Zisterne' }],
        ['border_colour', 'Kontur rot', { entity: 'sensor.tank', border_colour: '#cc0000' }],
        ['fill_colour', 'Fuellung gruen', { entity: 'sensor.tank', fill_colour: '#22aa55' }],
        ['max_level: 40 (Zahl)', '20/40 -> halb', { entity: 'sensor.tank', max_level: 40 }],
        ['max_level: "40" (String, wie Editor)', '20/40 -> halb, wie oben', { entity: 'sensor.tank', max_level: '40' }],
        ['max_level: 10 (Wert > max)', 'randvoll', { entity: 'sensor.tank', max_level: 10 }],
        ['secondary_entity', 'zweiter Block Rate 3.5 mm/h', { entity: 'sensor.tank', secondary_entity: 'sensor.flow' }],
        ['language: de', 'Gesamt / Intensitaet', { entity: 'sensor.tank', secondary_entity: 'sensor.flow', language: 'de' }],
        ['language: cs', 'Uhrn srazek / Intenzita srazek', { entity: 'sensor.tank', secondary_entity: 'sensor.flow', language: 'cs' }],
        ['language: da (NICHT registriert)', 'Fallback en erwartet', { entity: 'sensor.tank', secondary_entity: 'sensor.flow', language: 'da' }],
        ['language: hu (NICHT registriert)', 'Fallback en erwartet', { entity: 'sensor.tank', secondary_entity: 'sensor.flow', language: 'hu' }],
        ['language: xx (unbekannt)', 'Fallback en erwartet', { entity: 'sensor.tank', language: 'xx' }],
        ['show_warning', 'gelbe Warnung', { entity: 'sensor.tank', show_warning: true }],
        ['show_error', 'rote Fehlerkarte', { entity: 'sensor.tank', show_error: true }],
        ['ohne entity', 'kein Absturz, Wert 0', {}],
        ['entity unavailable', 'kein Absturz, NaN?', { entity: 'sensor.unavailable' }],
        ['show_warning + language de', 'erwartet "Warnung anzeigen"', { entity: 'sensor.tank', show_warning: true, language: 'de' }],
        ['show_error + language de', 'erwartet "Fehler anzeigen"', { entity: 'sensor.tank', show_error: true, language: 'de' }],
        ['Entity mit unit_of_measurement %', 'erwartet %, nicht mm', { entity: 'sensor.percent' }],
        ['Entity-State "unknown"', 'kein NaN erwartet', { entity: 'sensor.unknown' }],
        ['negativer Wert', 'leer erwartet', { entity: 'sensor.negative' }],
        ['max_level: 0', 'Division durch 0?', { entity: 'sensor.tank', max_level: 0 }],
        ['Flow-Entity mit eigener Einheit L/h', 'erwartet L/h, nicht %/h', { entity: 'sensor.percent', max_level: 100, secondary_entity: 'sensor.flowlh' }],
        ['Pumpenleistung als 2. Entity', 'Cistern Level 75 % / Pump Power 450 W', { entity: 'sensor.percent', max_level: 100, secondary_entity: 'sensor.pump' }],
        ['2. Entity ohne Einheit', 'nur die Zahl, nichts angehaengt', { entity: 'sensor.percent', max_level: 100, secondary_entity: 'sensor.nounit' }],
        ['Haupt-Entity ohne Einheit', 'nackte Zahl, kein erfundenes mm', { entity: 'sensor.nounit', max_level: 10 }],
        ['aspect_ratio: 1 (Kreis)', 'Breite 182 = Hoehe', { entity: 'sensor.tank', aspect_ratio: 1 }],
        ['aspect_ratio: 2 (Default)', 'Breite 91', { entity: 'sensor.tank', aspect_ratio: 2 }],
        ['aspect_ratio unges., = Default', 'Breite 91 wie oben', { entity: 'sensor.tank' }],
        ['aspect_ratio: 10 (Rohr)', 'Breite 18.2', { entity: 'sensor.tank', aspect_ratio: 10 }],
        ['aspect_ratio: "3" (String/Editor)', 'Breite 60.667', { entity: 'sensor.tank', aspect_ratio: '3' }],
        ['aspect_ratio: 0.5 -> klemmt auf 1', 'Breite 182', { entity: 'sensor.tank', aspect_ratio: 0.5 }],
        ['aspect_ratio: 99 -> klemmt auf 10', 'Breite 18.2', { entity: 'sensor.tank', aspect_ratio: 99 }],
        ['aspect_ratio: "quark" -> Default', 'Breite 91', { entity: 'sensor.tank', aspect_ratio: 'quark' }],
        ['entity_name ueberschreibt friendly_name', 'Zisterne statt Cistern Level',
          { entity: 'sensor.percent', max_level: 100, entity_name: 'Zisterne' }],
        ['secondary_entity_name ueberschreibt', 'Pumpe statt Pump Power',
          { entity: 'sensor.percent', max_level: 100, secondary_entity: 'sensor.pump',
            secondary_entity_name: 'Pumpe' }],
        ['leerer Name = kein Override', 'faellt auf friendly_name zurueck',
          { entity: 'sensor.percent', max_level: 100, entity_name: '' }],
        ['Override ohne friendly_name', 'Override gewinnt trotzdem',
          { entity: 'sensor.flowlh', max_level: 100, entity_name: 'Benannt' }],
        ['Praezision: keine Angabe', 'unveraendert, aber lokalisiert', { entity: 'sensor.raw', max_level: 5000 }],
        ['Praezision: suggested_display_precision 2', 'erwartet 2,399.67', { entity: 'sensor.suggested', max_level: 5000 }],
        ['Praezision: Registry 2', 'erwartet 2,399.67', { entity: 'sensor.registry2', max_level: 5000 }],
        ['Praezision: Registry schlaegt suggested', 'Registry 0 gewinnt gegen suggested 2', { entity: 'sensor.registry0', max_level: 5000 }],
        ['Praezision auch fuer 2. Entity', 'erwartet 2,399.67', { entity: 'sensor.percent', max_level: 100, secondary_entity: 'sensor.suggested' }],
        ['tap/hold/double_tap', 'rendert normal', {
          entity: 'sensor.tank',
          tap_action: { action: 'more-info' },
          hold_action: { action: 'none' },
          double_tap_action: { action: 'none' },
        }],
      ];

      await customElements.whenDefined('liquid-level-gauge-card');
      const grid = document.getElementById('grid');
      const results = [];

      for (const [title, expect, config] of cases) {
        const box = document.createElement('div');
        box.className = 'case';
        box.innerHTML = `<h3></h3><div class="expect"></div>`;
        box.querySelector('h3').textContent = title;
        box.querySelector('.expect').textContent = expect;
        grid.appendChild(box);

        try {
          const el = document.createElement('liquid-level-gauge-card');
          el.setConfig({ type: 'custom:liquid-level-gauge-card', ...config });
          el.hass = hass;
          box.appendChild(el);
          await el.updateComplete;
          const txt = (el.shadowRoot?.textContent || '').replace(/\s+/g, ' ').trim();
          const rect = el.shadowRoot?.querySelector('rect');
          results.push({
            case: title,
            ok: true,
            text: txt,
            translate: rect?.getAttribute('transform') ?? null,
            fill: rect?.getAttribute('style') ?? null,
            width: rect?.getAttribute('width') ?? null,
            d: el.shadowRoot?.querySelector('clipPath path')?.getAttribute('d') ?? null,
          });
        } catch (e) {
          box.insertAdjacentHTML('beforeend', `<div style="padding:8px;background:#f8d7da">THREW: ${e.message}</div>`);
          results.push({ case: title, ok: false, error: e.message });
        }
      }


      // --- Reaktivitaetstest: aendert sich nur die Rate-Entity, rendert die Karte neu? ---
      {
        const el = document.createElement("liquid-level-gauge-card");
        el.setConfig({ type: "custom:liquid-level-gauge-card", entity: "sensor.tank", secondary_entity: "sensor.flow" });
        el.hass = { ...hass, states: { ...hass.states } };
        document.body.appendChild(el);
        await el.updateComplete;
        const before = (el.shadowRoot?.textContent || "").replace(/\s+/g, " ").trim();

        // Nur die Rate-Entity aendert sich, neues states-Objekt wie in echtem HA
        el.hass = { ...hass, states: { ...hass.states,
          "sensor.flow": { entity_id: "sensor.flow", state: "99", attributes: { friendly_name: 'Cistern Level' } } } };
        await el.updateComplete;
        const afterRateOnly = (el.shadowRoot?.textContent || "").replace(/\s+/g, " ").trim();

        // Jetzt aendert sich zusaetzlich die Haupt-Entity
        el.hass = { ...hass, states: { ...hass.states,
          "sensor.flow": { entity_id: "sensor.flow", state: "99", attributes: { friendly_name: 'Cistern Level' } },
          "sensor.tank": { entity_id: "sensor.tank", state: "21", attributes: { friendly_name: 'Cistern Level' } } } };
        await el.updateComplete;
        const afterBoth = (el.shadowRoot?.textContent || "").replace(/\s+/g, " ").trim();

        results.push({ case: "REAKTIVITAET", ok: true,
          text: "vorher=[" + before + "] nurRate=[" + afterRateOnly + "] beide=[" + afterBoth + "]",
          translate: null, fill: null });
      }


      // --- Aufloesung der Konturfarbe ---------------------------------------
      // Prueft die var()-Kette, nicht das Aussehen: Custom Properties werden auf
      // einem Container gesetzt und die berechnete stroke-Farbe des Umrisses
      // zurueckgelesen. Voellig unabhaengig davon, wie Home Assistant aussieht.
      {
        const strokeOf = async (vars, config) => {
          const box = document.createElement('div');
          for (const [k, v] of Object.entries(vars)) box.style.setProperty(k, v);
          document.body.appendChild(box);
          const el = document.createElement('liquid-level-gauge-card');
          el.setConfig({ type: 'custom:liquid-level-gauge-card', entity: 'sensor.tank', ...config });
          el.hass = hass;
          box.appendChild(el);
          await el.updateComplete;
          const outline = el.shadowRoot.querySelector('svg > path');
          return getComputedStyle(outline).stroke;
        };

        const cases = [
          ['beide Variablen gesetzt -> secondary gewinnt',
            { '--secondary-text-color': 'rgb(1, 2, 3)', '--primary-text-color': 'rgb(9, 9, 9)' }, {}],
          ['nur primary gesetzt -> primary',
            { '--primary-text-color': 'rgb(9, 9, 9)' }, {}],
          ['keine Variable, color geerbt -> currentColor',
            { color: 'rgb(7, 7, 7)' }, {}],
          ['border_colour gesetzt -> schlaegt alles',
            { '--secondary-text-color': 'rgb(1, 2, 3)' }, { border_colour: '#ff00ff' }],
        ];

        for (const [label, vars, config] of cases) {
          results.push({ case: 'KONTUR: ' + label, ok: true, text: await strokeOf(vars, config),
                         translate: null, fill: null });
        }
      }


      // --- getConfigForm ----------------------------------------------------
      // Home Assistant renders this form, so the harness cannot check how it
      // looks. What it CAN check is that the schema is well formed and that every
      // field name is a config key the card actually reads -- a typo there would
      // silently produce a control writing a key nothing consumes.
      {
        const KNOWN_KEYS = [
          'entity', 'name', 'entity_name', 'max_level', 'aspect_ratio', 'secondary_entity',
          'secondary_entity_name',
          'fill_colour', 'border_colour', 'language',
          'show_warning', 'show_error',
        ];

        const Card = customElements.get('liquid-level-gauge-card');
        const form = Card.getConfigForm();

        const flatten = (schema) =>
          schema.flatMap((e) => (e.schema ? flatten(e.schema) : [e]));
        // ALLE Eintraege, Container eingeschlossen: HA ruft computeLabel auch
        // fuer grid/expandable auf und faellt bei undefined auf
        // schema.name.split() zurueck, was fuer Container ohne name wirft.
        const everyEntry = (schema) =>
          schema.flatMap((e) => (e.schema ? [e, ...everyEntry(e.schema)] : [e]));
        const fields = flatten(form.schema);
        const names = fields.map((f) => f.name);

        const badLabel = everyEntry(form.schema)
          .filter((e) => { const l = form.computeLabel(e); return typeof l !== 'string' || l === ''; })
          .map((e) => e.name ?? e.type ?? '?');
        // Repliziert HAs _computeLabelCallback wortwoertlich, im schlechtesten
        // Fall: computeLabel falsy UND localize liefert nichts -> der letzte Term
        // dereferenziert schema.name, den Container nicht haben.
        const haCrash = [];
        for (const e of everyEntry(form.schema)) {
          try {
            void (form.computeLabel(e, () => '') || '' || e.name.split('_').join(' '));
          } catch (err) { haCrash.push(e.name ?? e.type ?? '?'); }
        }

        const helperThrows = [];
        for (const e of everyEntry(form.schema)) {
          try { form.computeHelper(e); } catch (err) { helperThrows.push(e.name ?? e.type); }
        }

        // Bewusst nicht im Formular: Entwicklerhilfen, nur ueber YAML erreichbar.
        const NOT_IN_FORM = ['show_warning', 'show_error'];

        const unknown = names.filter((n) => !KNOWN_KEYS.includes(n));
        const missing = KNOWN_KEYS.filter((k) => !names.includes(k) && !NOT_IN_FORM.includes(k));
        const noSelector = fields.filter((f) => !f.selector && !f.type).map((f) => f.name);
        const noLabel = names.filter((n) => !form.computeLabel({ name: n }));
        const dupes = names.filter((n, i) => names.indexOf(n) !== i);

        results.push({
          case: 'FORM', ok: true, translate: null, fill: null,
          text:
            'Blaetter=' + names.length +
            ' | Eintraege gesamt=' + everyEntry(form.schema).length +
            ' | Container=' + everyEntry(form.schema).filter((e) => e.schema).map((e) => e.type).join('/') +
            ' | unbekannte Keys=[' + unknown.join(',') + ']' +
            ' | fehlende Keys=[' + missing.join(',') + ']' +
            ' | doppelt=[' + dupes.join(',') + ']' +
            ' | ohne Selector=[' + noSelector.join(',') + ']' +
            ' | ohne Label=[' + noLabel.join(',') + ']' +
            ' | Label leer/kein String=[' + badLabel.join(',') + ']' +
            ' | HA-Kette wirft=[' + haCrash.join(',') + ']' +
            ' | Helper wirft=[' + helperThrows.join(',') + ']' +
            ' | entity required=' + !!fields.find((f) => f.name === 'entity')?.required,
        });
      }

      window.__RESULTS__ = results;
      const pre = document.createElement('pre');
      pre.id = 'results';
      pre.style.cssText = 'display:none';
      pre.textContent = JSON.stringify(results, null, 1);
      document.body.appendChild(pre);
      document.title = 'DONE';
    </script>
  </body>
</html>
