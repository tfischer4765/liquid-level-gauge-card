<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>layout</title>
    <style>
      body { font: 13px -apple-system, Helvetica, sans-serif; background: #eee; margin: 0; padding: 12px; }
      .case { margin-bottom: 14px; }
      .case > b { display: block; margin-bottom: 4px; }
      .frame { background: #fff; border: 1px solid #bbb; resize: none; overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="out"></div>
    <script type="module" src="/liquid-level-gauge-card.js"></script>
    <script type="module">
      // Only a box to put the card in; the layout under test is the card's own.
      class HaCard extends HTMLElement {
        constructor() { super(); this.attachShadow({ mode: 'open' }).innerHTML = '<slot></slot>'; }
        set header(v) {}
      }
      customElements.define('ha-card', HaCard);
      class W extends HTMLElement {}
      customElements.define('hui-warning', W);

      const hass = {
        states: {
          'sensor.level': { entity_id: 'sensor.level', state: '68',
            attributes: { unit_of_measurement: '%', friendly_name: 'Cistern Level', suggested_display_precision: 0 } },
          'sensor.pump': { entity_id: 'sensor.pump', state: '450',
            attributes: { unit_of_measurement: 'W', friendly_name: 'Pump Power Draw', suggested_display_precision: 0 } },
        },
        locale: { language: 'en', number_format: 'language' },
        entities: {},
        localize: (k) => k, language: 'en', callService: () => {},
      };

      await customElements.whenDefined('liquid-level-gauge-card');
      const out = document.getElementById('out');

      for (const [label, width, ratio] of [
        ['sehr schmal 160px ratio 2', 160, 2],
        ['schmal  240px  ratio 2', 240, 2],
        ['mittel  360px  ratio 2', 360, 2],
        ['normal  480px  ratio 2', 480, 2],
        ['breit   960px  ratio 2  (column_span: 2)', 960, 2],
        ['breit   960px  ratio 10 (schlankes Rohr)', 960, 10],
      ]) {
        const box = document.createElement('div');
        box.className = 'case';
        box.innerHTML = `<b>${label}</b>`;
        const frame = document.createElement('div');
        frame.className = 'frame';
        frame.style.width = width + 'px';
        const el = document.createElement('liquid-level-gauge-card');
        el.setConfig({
          type: 'custom:liquid-level-gauge-card', entity: 'sensor.level',
          secondary_entity: 'sensor.pump', max_level: 100, aspect_ratio: ratio,
        });
        el.hass = hass;
        frame.appendChild(el);
        box.appendChild(frame);
        out.appendChild(box);
        await el.updateComplete;
      }
      document.title = 'READY';
    </script>
  </body>
</html>
